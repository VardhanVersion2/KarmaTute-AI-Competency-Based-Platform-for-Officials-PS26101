spring.application.name=KarmaTute
server.port=${PORT:8080}

# Spring AI Mistral configuration
spring.ai.mistralai.api-key=

# Database Configuration with Environment Overrides (Default: H2 in dev)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:karmatute;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# HikariCP Conservative Connection Pool for Cloud Deployment
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# CORS Allowed Origins
cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:3000,http://localhost:3001}

# Resilience4j Configuration
resilience4j.retry.instances.aiGateway.maxAttempts=3
resilience4j.retry.instances.aiGateway.waitDuration=2s

resilience4j.circuitbreaker.instances.aiGateway.failureRateThreshold=50
resilience4j.circuitbreaker.instances.aiGateway.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.aiGateway.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.aiGateway.permittedNumberOfCallsInHalfOpenState=3

resilience4j.ratelimiter.instances.aiGateway.limitForPeriod=10
resilience4j.ratelimiter.instances.aiGateway.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.aiGateway.timeoutDuration=500ms

resilience4j.bulkhead.instances.aiGateway.maxConcurrentCalls=10

# Actuator Health & Readiness Probes
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,readiness
management.endpoint.health.show-details=always

# Demo mode — false means no Rajesh Kumar seeding
karmatute.demo.mode=true
