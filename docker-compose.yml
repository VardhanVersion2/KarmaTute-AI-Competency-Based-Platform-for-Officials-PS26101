version: '3.8'

services:
  backend:
    build: ./backend
    container_name: karmatute-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  frontend:
    build: ./frontend
    container_name: karmatute-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
